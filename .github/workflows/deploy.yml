name: Deploy E-commerce Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecommerce-server-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.LIGHTSAIL_PORT }}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            'cd /var/www/ecommerce-server &&
             git fetch origin main &&
             git reset --hard origin/main &&
             npm ci --omit=dev &&
             pm2 restart ecommerce-server --update-env'

      - name: Verify local port and HTTPS endpoint
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.LIGHTSAIL_PORT }}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            'pm2 pid ecommerce-server > /dev/null && sleep 5 && ss -tln | grep -q "7801" && CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.labelaadvi.com) && echo "HTTP status: $CODE" && test "$CODE" -lt 500'
